<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot sheet</title>
<style>
  /* The brand palette lives here once. Every SVG uses these variables, so one edit recolors every drawing. */
  :root { --body: #6d5efc; --accent: #ffc857; --dark: #1e1a3c; --light: #ffffff; --bg: #f6f5fb; --ink: #1c1a2e; --muted: #6b6880; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 32px 0 12px; }
  p.lead { margin: 0; color: var(--muted); max-width: 70ch; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid rgba(28, 26, 46, .1); border-radius: 16px; padding: 14px; }
  .card svg.art { width: 100%; height: auto; display: block; }
  .card h3 { margin: 8px 0 2px; font-size: 16px; } .card p { margin: 0; color: var(--muted); font-size: 13px; }
  .sil { display: flex; align-items: flex-end; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(28, 26, 46, .15); }
  .sil svg { filter: brightness(0); height: auto; }       /* the silhouette test: all black, at small sizes */
  .sil span { font-size: 11px; color: var(--muted); margin-left: auto; }
  .guides line { stroke: rgba(28, 26, 46, .22); stroke-width: 1; stroke-dasharray: 4 4; }
  code { font: 12px ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Pip: concepts</h1>
  <p class="lead">Replace this text with one line from the brief. One card for each concept, view or expression.</p>

  <h2>Concepts</h2>
  <div class="sheet">
    <!-- One card. Copy it for each concept. Draw in a 200 x 240 box. The ground is at y = 220. -->
    <article class="card">
      <svg class="art" viewBox="0 0 200 240" role="img" aria-label="Concept A: round guide with an antenna">
        <g id="a-limbs" fill="var(--body)">
          <rect x="38" y="140" width="22" height="48" rx="11" transform="rotate(18 49 140)"/>
          <rect x="140" y="140" width="22" height="48" rx="11" transform="rotate(-18 151 140)"/>
          <ellipse cx="78" cy="214" rx="22" ry="9" fill="var(--accent)"/><ellipse cx="122" cy="214" rx="22" ry="9" fill="var(--accent)"/>
        </g>
        <g id="a-body"><ellipse cx="100" cy="172" rx="50" ry="44" fill="var(--body)"/></g>
        <g id="a-head">
          <rect x="97" y="18" width="6" height="26" rx="3" fill="var(--dark)"/><circle cx="100" cy="16" r="9" fill="var(--accent)"/>
          <ellipse cx="100" cy="96" rx="70" ry="60" fill="var(--body)"/>
          <g id="a-eyes" fill="var(--dark)">
            <ellipse cx="76" cy="98" rx="11" ry="14"/><ellipse cx="124" cy="98" rx="11" ry="14"/>
            <circle cx="80" cy="92" r="4" fill="var(--light)"/><circle cx="128" cy="92" r="4" fill="var(--light)"/>
          </g>
          <path d="M90 120 Q100 130 110 120" fill="none" stroke="var(--dark)" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="56" cy="112" rx="8" ry="5" fill="var(--accent)"/><ellipse cx="144" cy="112" rx="8" ry="5" fill="var(--accent)"/>
        </g>
      </svg>
      <h3>A. Round guide</h3>
      <p>Sphere head, gumdrop body, antenna as the signature. Calm and friendly.</p>
    </article>
  </div>

  <!-- For the turnaround, add this group inside each svg, behind the drawing. The same lines in every view keep the proportions equal.
  <g class="guides"><line x1="0" y1="36" x2="200" y2="36"/><line x1="0" y1="98" x2="200" y2="98"/><line x1="0" y1="150" x2="200" y2="150"/><line x1="0" y1="220" x2="200" y2="220"/></g>
  -->
</main>
<script>
  // Add the silhouette row to every card: the same drawing in black at 64, 32 and 16 px.
  for (const card of document.querySelectorAll('.card')) {
    const art = card.querySelector('svg.art'); if (!art) continue;
    const row = document.createElement('div'); row.className = 'sil';
    for (const px of [64, 32, 16]) { const s = art.cloneNode(true); s.removeAttribute('class'); s.setAttribute('width', px); s.removeAttribute('role'); s.setAttribute('aria-hidden', 'true'); row.append(s); }
    const note = document.createElement('span'); note.textContent = 'silhouette 64 / 32 / 16'; row.append(note);
    card.append(row);
  }
</script>
</body>
</html>
